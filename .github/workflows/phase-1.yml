# Phase 1 打包流水线：在 macOS arm64 runner 上产出 .app / DMG / 校验和并上传 artifact。
#
# 职责边界：gofmt / go vet / go test / go test -race 这些检查由 ci.yml 负责
# （ubuntu runner，更快更便宜，每个 PR 和 master push 都跑）。本文件只保留
# 必须在 macOS 上做的打包、签名与包内校验，避免 macOS 分钟被重复的检查步骤吃掉。
name: Phase 1 validation

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  darwin-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Verify Apple silicon runner
        run: test "$(uname -m)" = arm64
      - name: Build arm64 app and DNS proxy
        run: ./scripts/build-darwin-arm64.sh
      - name: Verify packaged app
        run: ./scripts/verify-darwin-arm64.sh
      - name: Upload Phase 1 artifacts
        uses: actions/upload-artifact@v7
        with:
          name: mhost-phase-1-darwin-arm64
          path: |
            build/darwin-arm64/*.app
            build/darwin-arm64/*.dmg
            build/darwin-arm64/build-metadata.txt
            build/darwin-arm64/SHA256SUMS
          if-no-files-found: error
